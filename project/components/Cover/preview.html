<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>mod Design System</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .b1 { fill:var(--blue-1); }
  .b2 { fill:var(--blue-2); }
  .ac { fill:var(--accent); }
  .ac2 { fill:var(--accent-2); }
  .b4 { fill:var(--blue-4); }
  .blk { rx:var(--radius); }
  .bar { rx:var(--radius); }
  .seg { rx:var(--radius-code); }
  .words { position:absolute; left:var(--gutter); bottom:var(--gutter); max-width:440px; }
  .name { margin:0; font-size:72px; line-height:.95; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--gap-sm) 0 0 3px; font-size:14px; line-height:20px; color:var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks       blue-1 232x268 slab bled off the top · accent 252x120 bled off the top-right · blue-4 112x192 and blue-2 124x192 bled off the bottom; about 43% of 960x288
  arrangement  one tall mod-blue slab with three satellites, gap-lg (16) gutters, all right of x = 480
  pattern      pills: the logo's own rounded stroke. On the slab, the favicon's three bars (short, tall, short) in accent, the brand's lime-on-blue pairing;
               on the lime, ten small blue-1 pills with the tenth quieter (accent-2), the portal's ten-segment security bar. Chosen because both shapes are mod's and nobody else's.
  scales       gutters gap-lg 16 · pill pitches pad-tile 20 and gap-sm 8 · heights in gap-md 12 multiples · block corners radius 18 · pills rx half their width: radius 18 (36 wide), radius-code 6 (12 wide)
-->
<rect class="b1 blk" x="0" y="-20" width="232" height="268" rx="18"/>
<rect class="ac bar" x="42" y="104" width="36" height="120" rx="18"/>
<rect class="ac bar" x="98" y="56" width="36" height="168" rx="18"/>
<rect class="ac bar" x="154" y="104" width="36" height="120" rx="18"/>
<rect class="ac blk" x="248" y="-20" width="252" height="120" rx="18"/>
<rect class="b1 seg" x="268" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="288" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="308" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="328" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="348" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="368" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="388" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="408" y="32" width="12" height="40" rx="6"/>
<rect class="b1 seg" x="428" y="32" width="12" height="40" rx="6"/>
<rect class="ac2 seg" x="448" y="32" width="12" height="40" rx="6"/>
<rect class="b4 blk" x="248" y="116" width="112" height="192" rx="18"/>
<rect class="b2 blk" x="376" y="116" width="124" height="192" rx="18"/>
</svg>
</div>
<div class="words">
<h1 class="name">mod Design<br>System</h1>
<p class="tag">Built to inspire.</p>
</div>
</div>
</body>
</html>
