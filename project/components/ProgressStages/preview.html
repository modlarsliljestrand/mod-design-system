<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>ProgressStages</title>
<style>.pv{padding:20px}</style>
</head>
<body>
<div class="pv">
<div class="progress">
  <div class="progress__bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="progress__fill" style="width:70%"></div></div>
  <ol class="stages" style="list-style:none;margin:0;padding:0">
    <li class="stage done"><div class="stage__dot" aria-hidden="true">✓</div><div class="stage__label">Submission received</div><div class="stage__when">2026-09-21 21:50</div></li>
    <li class="stage done"><div class="stage__dot" aria-hidden="true">✓</div><div class="stage__label">Review started</div><div class="stage__when">2026-09-22 08:15</div></li>
    <li class="stage done"><div class="stage__dot" aria-hidden="true">✓</div><div class="stage__label">Review complete</div><div class="stage__when">2026-09-25 16:40</div>
      <ul class="stage__notes"><li><b>Reviewer</b>Approved. Tile on the mod AI Portal only.</li></ul></li>
    <li class="stage active" aria-current="step"><div class="stage__dot" aria-hidden="true">4</div><div class="stage__label">Building</div><div class="stage__when">In progress</div></li>
    <li class="stage"><div class="stage__dot" aria-hidden="true">5</div><div class="stage__label">Published</div><div class="stage__when"></div></li>
  </ol>
</div>
</div>
</body>
</html>
